function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open('towngg-private-plans',1);req.onupgradeneeded=()=>req.result.createObjectStore('credentials');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function getRemembered(){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction('credentials','readonly'),req=tx.objectStore('credentials').get(storeName);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close()})}
async function setRemembered(key){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction('credentials','readwrite');if(key)tx.objectStore('credentials').put(key,storeName);else tx.objectStore('credentials').delete(storeName);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error)})}

function showPlan(html){document.open();document.write(html);document.close()}
async function deriveKey(pass){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(salt),iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt'])}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('unlock'),msg=document.getElementById('message');button.disabled=true;button.textContent='正在解锁…';msg.textContent='';try{const key=await deriveKey(document.getElementById('password').value);const html=await decryptWith(key);try{await setRemembered(document.getElementById('remember').checked?key:null)}catch(err){/* Private browsing may block persistent storage; manual unlock still works. */}showPlan(html)}catch(err){msg.textContent='密码错误或页面数据无法解锁，请重试。';button.disabled=false;button.textContent='解锁我们的计划'}});
(async()=>{try{const key=await getRemembered();if(!key)return;const button=document.getElementById('unlock');button.disabled=true;button.textContent='正在自动解锁…';try{showPlan(await decryptWith(key))}catch(err){await setRemembered(null);button.disabled=false;button.textContent='解锁我们的计划'}}catch(err){/* Storage unavailable: leave normal password entry. */}})();
