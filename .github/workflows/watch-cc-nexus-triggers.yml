name: Watch CC and Nexus sync triggers

# Existing external half-hour triggers and :15/:45 native schedules remain.
on:
  schedule:
    - cron: '25,55 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check only; do not trigger missing workflows'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: sync-trigger-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check and recover missed workflow triggers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WATCHDOG_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/watch-cc-nexus-triggers.mjs
