name: Finalize Corrected Paid Creation Baseline

on:
  push:
    paths:
      - ".github/workflows/finalize-paid-baseline.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --prefer-offline --no-audit --no-fund
      - run: npx playwright install chromium

      - name: Restore Bethesda login state
        env:
          BETHESDA_STORAGE_STATE: ${{ secrets.BETHESDA_STORAGE_STATE }}
        run: |
          if [ -n "$BETHESDA_STORAGE_STATE" ]; then
            mkdir -p .auth
            printf '%s' "$BETHESDA_STORAGE_STATE" > .auth/bethesda-storage.json
          fi

      - name: Rebuild paid stats baseline with unified parser
        env:
          CC_ONLY_PAID: "true"
        run: xvfb-run -a node scripts/sync-creations.js --headed

      - name: Refresh paid likes
        run: xvfb-run -a node scripts/sync-paid-creation-likes.js --headed

      - name: Print corrected paid baseline
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const source=fs.readFileSync('assets/js/site-data.js','utf8');
          const context={window:{}};
          vm.createContext(context);
          vm.runInContext(source,context);
          const rows=(context.window.siteData?.creations||[])
            .filter((item)=>item.isPaid===true||Number(item.price||0)>0)
            .map((item)=>({
              title:item.title,
              views:item.views,
              bookmarks:item.bookmarks,
              likes:item.likes,
              downloads:item.downloads,
              plays:item.plays,
              libraryAdds:item.libraryAdds
            }));
          console.table(rows);
          console.log(JSON.stringify(rows,null,2));
          NODE

      - name: Commit corrected baseline
        run: |
          if git diff --quiet -- assets/js/site-data.js; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/site-data.js
          git commit -m "Finalize corrected paid Creation stats baseline"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Trigger external site deploy hook
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$CLOUDFLARE_PAGES_DEPLOY_HOOK" ]; then
            curl -fsSL -X POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
          fi
