name: Adjust Cassilia media sizing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/adjust-cassilia-media.yml"

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent soul-link image overlap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/cassilia-media.css')
          text = p.read_text(encoding='utf-8')
          old = 'width: clamp(220px, 26vw, 420px);'
          new = 'width: clamp(190px, 18vw, 280px);'
          if old not in text:
              raise SystemExit('Expected sizing rule not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit adjustment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/cassilia-media.css
          git commit -m "Prevent Cassilia soul-link image overlap"
          git push
