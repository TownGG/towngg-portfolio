name: Bump admin dashboard live data cache

on:
  push:
    paths:
      - '.github/workflows/bump-admin-dashboard-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump admin script versions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('admin-upload.html')
          text = path.read_text(encoding='utf-8')
          pairs = [
              ('admin-dashboard.js?v=2.05.16', 'admin-dashboard.js?v=2.05.23'),
              ('admin-dashboard-insights.js?v=2.05.17', 'admin-dashboard-insights.js?v=2.05.23'),
              ('admin-dashboard-metric-override.js?v=2.05.18', 'admin-dashboard-metric-override.js?v=2.05.23'),
          ]
          for old, new in pairs:
              if old not in text:
                  raise SystemExit(f'cache version not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-upload.html
          git commit -m "Refresh admin dashboard live data scripts"
          git pull --rebase origin main
          git push origin HEAD:main
