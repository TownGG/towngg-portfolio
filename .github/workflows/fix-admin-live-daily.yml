name: Fix admin dashboard live daily refresh

on:
  push:
    paths:
      - '.github/workflows/fix-admin-live-daily.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch admin data sources
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'assets/js/admin-dashboard.js': [
                  ("const CREATIONS_DAILY_URL = './assets/data/creations-mod-daily.csv';", "const CREATIONS_DAILY_URL = 'https://raw.githubusercontent.com/TownGG/towngg-portfolio/main/assets/data/creations-mod-daily.csv';"),
                  ("const NEXUS_HISTORY_URL = './assets/data/nexus-history.csv';", "const NEXUS_HISTORY_URL = 'https://raw.githubusercontent.com/TownGG/towngg-portfolio/main/assets/data/nexus-history.csv';"),
                  ("const NEXUS_LATEST_URL = './assets/data/nexus-latest.json';", "const NEXUS_LATEST_URL = 'https://raw.githubusercontent.com/TownGG/towngg-portfolio/main/assets/data/nexus-latest.json';"),
              ],
              'assets/js/admin-dashboard-insights.js': [
                  ("const CREATIONS_DAILY_URL = './assets/data/creations-mod-daily.csv';", "const CREATIONS_DAILY_URL = 'https://raw.githubusercontent.com/TownGG/towngg-portfolio/main/assets/data/creations-mod-daily.csv';"),
                  ("const NEXUS_HISTORY_URL = './assets/data/nexus-history.csv';", "const NEXUS_HISTORY_URL = 'https://raw.githubusercontent.com/TownGG/towngg-portfolio/main/assets/data/nexus-history.csv';"),
              ],
              'assets/js/admin-dashboard-metric-override.js': [
                  ("const NEXUS_HISTORY_URL = './assets/data/nexus-history.csv';", "const NEXUS_HISTORY_URL = 'https://raw.githubusercontent.com/TownGG/towngg-portfolio/main/assets/data/nexus-history.csv';"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'pattern not found in {filename}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/admin-dashboard.js assets/js/admin-dashboard-insights.js assets/js/admin-dashboard-metric-override.js
          git commit -m "Use live GitHub data in admin dashboard"
          git pull --rebase origin main
          git push origin HEAD:main
