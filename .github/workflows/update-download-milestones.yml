name: Update download milestones

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-download-milestones
  cancel-in-progress: false

jobs:
  update-milestones:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update milestone data
        run: node scripts/update-download-milestones.mjs

      - name: Commit milestone when changed
        shell: bash
        run: |
          if git diff --quiet -- assets/data/personal-logs-meta.json assets/data/release-version.json; then
            echo "No new download milestone."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/personal-logs-meta.json assets/data/release-version.json
          git commit -m "Update download milestones"
          git pull --rebase origin main
          git push origin HEAD:main
