name: Update download milestones

on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-download-milestones
  cancel-in-progress: false

jobs:
  update-milestones:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update milestone data
        run: node scripts/update-download-milestones.mjs

      - name: Commit milestone when changed
        shell: bash
        run: |
          if git diff --quiet -- assets/data/personal-logs-meta.json assets/data/release-version.json; then
            echo "No new download milestone."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/personal-logs-meta.json assets/data/release-version.json
          git commit -m "Update download milestones"
          git pull --rebase origin main
          git push origin HEAD:main

  # Independent backup: this established scheduled workflow was firing even
  # when the newly added CC/Nexus schedules were not. Keep its existing
  # milestone job intact, and use a separate scoped-token job for dispatch.
  check-sync-health:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js for sync watchdog
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Detect and recover missing CC and Nexus sync triggers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/watch-cc-nexus-triggers.mjs
