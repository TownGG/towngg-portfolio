name: Add dashboard day window

on:
  push:
    paths:
      - '.github/workflows/add-dashboard-day-window.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add daily statistics window to dashboard header
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('assets/js/admin-dashboard.js')
          text = js_path.read_text(encoding='utf-8')

          replacements = {
              "dashboard: 'Dashboard', subtitle: 'Download analytics overview', lastSync:": "dashboard: 'Dashboard', subtitle: 'Download analytics overview', dayWindow: 'Daily statistics: UTC 00:00–23:59 · Beijing 08:00–next day 07:59', lastSync:",
              "dashboard: '首页看板', subtitle: '平台下载数据分析总览', lastSync:": "dashboard: '首页看板', subtitle: '平台下载数据分析总览', dayWindow: '每日统计口径：UTC 00:00–23:59 · 北京时间 08:00–次日 07:59', lastSync:",
              "dashboard: 'ダッシュボード', subtitle: 'プラットフォーム別ダウンロード分析', lastSync:": "dashboard: 'ダッシュボード', subtitle: 'プラットフォーム別ダウンロード分析', dayWindow: '日次集計：UTC 00:00–23:59 · 北京時間 08:00–翌日 07:59', lastSync:",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)

          old_markup = '<p data-admin-dashboard-subtitle>Download analytics overview</p></div><div class="admin-dashboard-tools">'
          new_markup = '<p data-admin-dashboard-subtitle>Download analytics overview</p><p class="admin-dashboard-day-window" data-admin-dashboard-day-window>Daily statistics: UTC 00:00–23:59 · Beijing 08:00–next day 07:59</p></div><div class="admin-dashboard-tools">'
          if old_markup in text:
              text = text.replace(old_markup, new_markup, 1)

          old_mapping = "'[data-admin-dashboard-title]': 'dashboard', '[data-admin-dashboard-subtitle]': 'subtitle', '[data-admin-downloads-title]'"
          new_mapping = "'[data-admin-dashboard-title]': 'dashboard', '[data-admin-dashboard-subtitle]': 'subtitle', '[data-admin-dashboard-day-window]': 'dayWindow', '[data-admin-downloads-title]'"
          if old_mapping in text:
              text = text.replace(old_mapping, new_mapping, 1)

          if 'data-admin-dashboard-day-window' not in text or "dayWindow: '每日统计口径" not in text:
              raise SystemExit('Failed to patch dashboard day window')
          js_path.write_text(text, encoding='utf-8')

          css_path = Path('assets/css/admin-dashboard.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* dashboard-day-window */'
          if marker not in css:
              css += '''\n\n/* dashboard-day-window */\n.admin-dashboard-day-window {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  margin: 9px 0 0;\n  padding: 6px 10px;\n  width: fit-content;\n  max-width: 100%;\n  border: 1px solid rgba(67, 199, 255, .22);\n  border-radius: 7px;\n  background: rgba(67, 199, 255, .065);\n  color: rgba(218, 239, 250, .76);\n  font-size: 12px;\n  line-height: 1.45;\n  letter-spacing: .01em;\n}\n.admin-dashboard-day-window::before {\n  content: '◷';\n  color: #43c7ff;\n  font-size: 13px;\n  flex: 0 0 auto;\n}\n@media (max-width: 720px) {\n  .admin-dashboard-day-window {\n    display: flex;\n    width: 100%;\n    font-size: 11px;\n  }\n}\n'''
              css_path.write_text(css, encoding='utf-8')

          html_path = Path('admin-upload.html')
          html = html_path.read_text(encoding='utf-8')
          html = re.sub(r'admin-dashboard\.css\?v=[^"\']+', 'admin-dashboard.css?v=2.05.21', html)
          html = re.sub(r'admin-dashboard\.js\?v=[^"\']+', 'admin-dashboard.js?v=2.05.21', html)
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Commit dashboard header note
        run: |
          if git diff --quiet; then
            echo "Dashboard day window is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/admin-dashboard.js assets/css/admin-dashboard.css admin-upload.html
          git commit -m "Show UTC daily range on admin dashboard"
          git pull --rebase origin main
          git push origin HEAD:main
