name: Fix Cassilia Power Fist media and hero alignment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-cassilia-powerfist-alignment.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct Power Fist media and restore container alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          version = "3.2.202607300900"

          html_path = Path("cassilia.html")
          html = html_path.read_text(encoding="utf-8")

          article_start = html.index('<article class="legacy-chapter power-chapter reveal-block">')
          article_end = html.index('</article>', article_start) + len('</article>')
          article = html[article_start:article_end]

          old_grid_start = article.index('<div class="legacy-media-grid">')
          old_grid_end = article.index('</div>', old_grid_start) + len('</div>')

          new_grid = '''<div class="legacy-media-grid power-media-grid">
          <figure class="legacy-media-main"><img src="./assets/images/gallery-all-compressed/screenshot_20260618_006.jpg" alt="Cassilia wearing a Power Fist in a white bodysuit" loading="lazy"></figure>
          <figure><img src="./assets/images/gallery-all-compressed/screenshot_20260618_001.jpg" alt="Black and gold Power Fist close-up" loading="lazy"></figure>
          <figure><img src="./assets/images/gallery-all-compressed/screenshot_20260618_004.jpg" alt="Crimson red Power Fist variant" loading="lazy"></figure>
          <figure><img src="./assets/images/gallery-all-compressed/screenshot_20260618_005.jpg" alt="Yellow industrial Power Fist variant" loading="lazy"></figure>
          <figure><img src="./assets/images/gallery-all-compressed/screenshot_20260618_007.jpg" alt="Orange tactical Power Fist worn in combat gear" loading="lazy"></figure>
          <figure><img src="./assets/images/gallery-all-compressed/screenshot_20260618_008.jpg" alt="Orange tactical Power Fist detail view" loading="lazy"></figure>
        </div>'''

          article = article[:old_grid_start] + new_grid + article[old_grid_end:]
          html = html[:article_start] + article + html[article_end:]
          html = html.replace(
              '<link rel="stylesheet" href="./assets/css/cassilia.css?v=3.1.202607292152">',
              f'<link rel="stylesheet" href="./assets/css/cassilia.css?v={version}">'
          )
          html_path.write_text(html, encoding="utf-8")

          css_index_path = Path("assets/css/cassilia.css")
          css_index = css_index_path.read_text(encoding="utf-8")
          css_index = css_index.replace(
              '@import url("./cassilia-media.css?v=3.1.202607292152");',
              f'@import url("./cassilia-media.css?v={version}");'
          )
          css_index_path.write_text(css_index, encoding="utf-8")

          media_path = Path("assets/css/cassilia-media.css")
          media = media_path.read_text(encoding="utf-8")
          marker = "/* Cassilia Power Fist and hero alignment correction v3.2 */"
          if marker not in media:
              media += f'''\n\n{marker}\n/* Keep hero text on the same alignment line as the site header and every .container section. */\nbody[data-page="cassilia"] .cassilia-hero-layout {{\n  width: min(1380px, 92%) !important;\n  margin-right: auto !important;\n  margin-left: auto !important;\n}}\n\n/* One full-body Power Fist image plus five real equipment detail/variant screenshots. */\n.power-media-grid {{\n  grid-template-rows: repeat(5, minmax(0, 1fr));\n}}\n\n.power-media-grid .legacy-media-main {{\n  grid-row: 1 / -1;\n}}\n'''
          media_path.write_text(media, encoding="utf-8")

          version_path = Path("assets/data/site-version.json")
          site_version = {
              "version": "v2.06.202607300900",
              "label": "v2.06.202607300900 Production",
              "status": "production",
              "updatedAt": "2026-07-30T01:00:00.000Z"
          }
          version_path.write_text(json.dumps(site_version, indent=2) + "\n", encoding="utf-8")

          # Verify the old unrelated Power Fist images are gone from this chapter.
          final_html = html_path.read_text(encoding="utf-8")
          start = final_html.index('<article class="legacy-chapter power-chapter reveal-block">')
          end = final_html.index('</article>', start)
          power = final_html[start:end]
          for old in ("20260729_035", "20260729_036", "20260729_037", "20260729_038"):
              assert old not in power, f"Old incorrect Power Fist image remains: {old}"
          for correct in ("20260618_006", "20260618_001", "20260618_004", "20260618_005", "20260618_007", "20260618_008"):
              assert correct in power, f"Correct Power Fist image missing: {correct}"
          assert 'width: min(1380px, 92%) !important;' in media_path.read_text(encoding="utf-8")
          print("Cassilia Power Fist media and hero alignment verified.")
          PY

          rm -f .github/workflows/fix-cassilia-powerfist-alignment.yml

      - name: Commit corrected Cassilia page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Cassilia Power Fist imagery and hero alignment"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 4
          done
          exit 1
