name: QA Cassilia story page

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qa-cassilia-story.yml"

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium

      - name: Run static and visual-layout QA
        shell: bash
        run: |
          python -m http.server 4173 >/tmp/cassilia-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const html = fs.readFileSync('cassilia.html', 'utf8');
          const refs = [...html.matchAll(/screenshot_20260729_(\d{3})\.jpg/g)].map(m => Number(m[1]));
          const narrative = refs.filter(n => n >= 8);
          const duplicates = narrative.filter((n, i) => narrative.indexOf(n) !== i);
          const coverRefs = refs.filter(n => n <= 7);
          const missing = [...new Set(refs)].filter(n => !fs.existsSync(`assets/images/gallery-all-compressed/screenshot_20260729_${String(n).padStart(3,'0')}.jpg`));

          const report = {
            generatedAt: new Date().toISOString(),
            sourceAudit: {
              allScreenshotReferences: refs,
              narrativeScreenshotReferences: narrative,
              narrativeUniqueCount: new Set(narrative).size,
              narrativeDuplicateNumbers: [...new Set(duplicates)],
              modCoverReferences: coverRefs,
              missingFiles: missing
            },
            viewports: {}
          };

          const browser = await chromium.launch({headless: true});
          for (const config of [
            {name: 'desktop', width: 1440, height: 900},
            {name: 'mobile', width: 390, height: 844}
          ]) {
            const page = await browser.newPage({viewport: {width: config.width, height: config.height}});
            const failed = [];
            page.on('requestfailed', req => failed.push({url: req.url(), error: req.failure()?.errorText || 'failed'}));
            await page.goto('http://127.0.0.1:4173/cassilia.html', {waitUntil: 'networkidle', timeout: 60000});
            await page.evaluate(async () => {
              const imgs = [...document.images];
              await Promise.all(imgs.map(img => img.complete ? Promise.resolve() : new Promise(resolve => {
                img.addEventListener('load', resolve, {once:true});
                img.addEventListener('error', resolve, {once:true});
              })));
            });

            const metrics = await page.evaluate(({vh}) => {
              return [...document.querySelectorAll('.story-panel')].map((section, index) => {
                const rect = section.getBoundingClientRect();
                const descendants = [...section.querySelectorAll('*')].filter(el => {
                  const style = getComputedStyle(el);
                  return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) !== 0;
                });
                let maxBottom = 0;
                for (const el of descendants) {
                  const r = el.getBoundingClientRect();
                  if (r.width > 2 && r.height > 2) maxBottom = Math.max(maxBottom, r.bottom - rect.top);
                }
                const trailingSpace = Math.max(0, rect.height - maxBottom);
                return {
                  index,
                  id: section.id || section.className.split(' ')[0],
                  className: section.className,
                  height: Math.round(rect.height),
                  viewportRatio: Number((rect.height / vh).toFixed(2)),
                  trailingSpace: Math.round(trailingSpace),
                  trailingViewportRatio: Number((trailingSpace / vh).toFixed(2))
                };
              });
            }, {vh: config.height});

            const brokenImages = await page.evaluate(() => [...document.images]
              .filter(img => !img.complete || img.naturalWidth === 0)
              .map(img => img.getAttribute('src')));

            report.viewports[config.name] = {
              size: `${config.width}x${config.height}`,
              documentHeight: await page.evaluate(() => document.documentElement.scrollHeight),
              sections: metrics,
              brokenImages,
              failedRequests: failed.filter(item => item.url.includes('assets/'))
            };
            await page.close();
          }
          await browser.close();

          report.pass =
            report.sourceAudit.narrativeDuplicateNumbers.length === 0 &&
            report.sourceAudit.missingFiles.length === 0 &&
            Object.values(report.viewports).every(v => v.brokenImages.length === 0 && v.failedRequests.length === 0);

          fs.mkdirSync('audit', {recursive:true});
          fs.writeFileSync('audit/cassilia-production-qa.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (!report.pass) process.exitCode = 1;
          JS

      - name: Commit QA report
        if: always()
        shell: bash
        run: |
          if [ ! -f audit/cassilia-production-qa.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/cassilia-production-qa.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Cassilia production QA"
          git push
