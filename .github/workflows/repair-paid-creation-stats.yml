name: Repair Paid Creation Stats

on:
  push:
    paths:
      - ".github/workflows/repair-paid-creation-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-bethesda-creations
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Restore Bethesda login state
        env:
          BETHESDA_STORAGE_STATE: ${{ secrets.BETHESDA_STORAGE_STATE }}
        run: |
          if [ -n "$BETHESDA_STORAGE_STATE" ]; then
            mkdir -p .auth
            printf '%s' "$BETHESDA_STORAGE_STATE" > .auth/bethesda-storage.json
          fi

      - name: Repair paid All Time stats
        run: xvfb-run -a node scripts/sync-creations-stats-alltime.js --paid-only --headed

      - name: Refresh paid likes
        run: xvfb-run -a node scripts/sync-paid-creation-likes.js --headed

      - name: Print paid Creation stats
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('assets/js/site-data.js', 'utf8');
          const context = { window: {} };
          vm.createContext(context);
          vm.runInContext(source, context);
          const rows = (context.window.siteData?.creations || [])
            .filter((item) => item.isPaid === true || Number(item.price || 0) > 0)
            .map((item) => ({
              title: item.title,
              price: item.price,
              views: item.views,
              bookmarks: item.bookmarks,
              likes: item.likes,
              downloads: item.downloads,
              plays: item.plays,
              libraryAdds: item.libraryAdds
            }));
          console.table(rows);
          console.log(JSON.stringify(rows, null, 2));
          NODE

      - name: Commit repaired paid stats
        run: |
          if git diff --quiet -- assets/js/site-data.js; then
            echo "No paid Creation stat changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/site-data.js
          git commit -m "Repair paid Creation stats"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Trigger external site deploy hook
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$CLOUDFLARE_PAGES_DEPLOY_HOOK" ]; then
            curl -fsSL -X POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
          fi
