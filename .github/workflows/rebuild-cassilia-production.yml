name: Rebuild Cassilia production page

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-cassilia-production.yml"

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace stale imagery and remove patch-era layers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('cassilia.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '<link rel="stylesheet" href="./assets/css/cassilia.css?v=2.4.202607291903">',
              '<link rel="preload" as="image" href="./assets/images/gallery-all-compressed/screenshot_20260729_008.jpg">\n  <link rel="stylesheet" href="./assets/css/cassilia.css?v=3.0.202607292045">'
          )

          text = text.replace(
              '<img src="./assets/images/gallery-all-compressed/screenshot_20260729_003.jpg" alt="" fetchpriority="high" data-hero-image>',
              '<img src="./assets/images/gallery-all-compressed/screenshot_20260729_008.jpg" alt="" fetchpriority="high" data-hero-image>'
          )

          text = re.sub(
              r'\n      <div class="cassilia-hero-cutout".*?</div>\n',
              '\n',
              text,
              count=1,
              flags=re.S
          )

          text = text.replace(
              '<img src="./assets/images/gallery-all-compressed/screenshot_20260729_007.jpg" alt="Cassilia in her casual outfit and glasses" loading="lazy">',
              '<img src="./assets/images/gallery-all-compressed/screenshot_20260729_009.jpg" alt="Cassilia in-game character portrait" loading="lazy">',
              1
          )

          sword_start = text.index('<section class="sword-section')
          sword_end = text.index('</section>', sword_start)
          sword_block = text[sword_start:sword_end]
          sword_block = sword_block.replace('screenshot_20260729_008.jpg', 'screenshot_20260729_026.jpg')
          sword_block = re.sub(
              r'\n      <div class="sword-cutout-layer".*?</div>\n',
              '\n',
              sword_block,
              count=1,
              flags=re.S
          )
          text = text[:sword_start] + sword_block + text[sword_end:]

          text = text.replace(
              '<img src="./assets/images/gallery-all-compressed/screenshot_20260729_026.jpg" alt="Cassilia walking across the temple grounds with Temerius" loading="lazy">',
              '<img src="./assets/images/gallery-all-compressed/screenshot_20260729_025.jpg" alt="Cassilia and the player facing one another during the temple battle" loading="lazy">',
              1
          )

          strip_pattern = re.compile(
              r'      <div class="terminus-battle-strip".*?      </div>\n      <div class="battle-line"',
              re.S
          )
          strip = '''      <div class="terminus-battle-strip" aria-label="Battle at the temple screenshot sequence">
        <figure><img src="./assets/images/gallery-all-compressed/screenshot_20260729_019.jpg" alt="Cassilia confronting the player at the temple" loading="lazy"></figure>
        <figure><img src="./assets/images/gallery-all-compressed/screenshot_20260729_020.jpg" alt="Temerius battle near the ancient structure" loading="lazy"></figure>
        <figure><img src="./assets/images/gallery-all-compressed/screenshot_20260729_022.jpg" alt="Cassilia attacking with Temerius" loading="lazy"></figure>
        <figure><img src="./assets/images/gallery-all-compressed/screenshot_20260729_023.jpg" alt="The player fighting Cassilia in the desert" loading="lazy"></figure>
      </div>
      <div class="battle-line"'''
          text, count = strip_pattern.subn(strip, text, count=1)
          if count != 1:
              raise SystemExit('Terminus battle strip was not replaced')

          soul_pattern = re.compile(
              r'      <div class="soul-split soul-left".*?      </div>\n      <div class="soul-split soul-right".*?      </div>',
              re.S
          )
          soul = '''      <div class="soul-split soul-left" aria-hidden="true">
        <img src="./assets/images/gallery-all-compressed/screenshot_20260729_024.jpg" alt="" loading="lazy">
      </div>
      <div class="soul-split soul-right" aria-hidden="true">
        <img src="./assets/images/gallery-all-compressed/screenshot_20260729_018.jpg" alt="" loading="lazy">
      </div>'''
          text, count = soul_pattern.subn(soul, text, count=1)
          if count != 1:
              raise SystemExit('Soul split imagery was not replaced')

          text = text.replace(
              '<section class="relationship-section story-panel" data-story-panel>\n',
              '<section class="relationship-section story-panel" data-story-panel>\n      <div class="relationship-bg" aria-hidden="true"><img src="./assets/images/gallery-all-compressed/screenshot_20260729_012.jpg" alt="" loading="lazy"></div>\n',
              1
          )

          text = text.replace(
              '<section class="finale-section story-panel" data-story-panel>\n',
              '<section class="finale-section story-panel" data-story-panel>\n      <div class="finale-photo-bg" aria-hidden="true"><img src="./assets/images/gallery-all-compressed/screenshot_20260729_033.jpg" alt="" loading="lazy"></div>\n',
              1
          )

          text = re.sub(
              r'\n  <script src="\./assets/js/cassilia-polish\.js\?v=[^"]+"></script>',
              '',
              text,
              count=1
          )

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/rebuild-cassilia-production.yml').unlink()
          PY

      - name: Commit rebuilt page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add cassilia.html .github/workflows/rebuild-cassilia-production.yml
          git commit -m "Rebuild Cassilia page without stale imagery or spacing patches"
          git push
