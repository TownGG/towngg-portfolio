name: Fix Cassilia Terminus story

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-cassilia-terminus-story.yml"

permissions:
  contents: write

jobs:
  fix-story:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct Terminus imagery and layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('cassilia.html')
          text = path.read_text(encoding='utf-8')

          text = re.sub(
              r'cassilia\.css\?v=[^"\']+',
              'cassilia.css?v=2.4.202607291903',
              text
          )

          # The stolen relic chapter uses the clean, text-free sword screenshot.
          text = text.replace(
              './assets/images/gallery-all-compressed/screenshot_20260729_001.jpg" alt="" loading="lazy">',
              './assets/images/gallery-all-compressed/screenshot_20260729_008.jpg" alt="" loading="lazy">',
              1
          )
          text = text.replace(
              './assets/images/gallery-all-compressed/screenshot_20260729_001.jpg" alt="">',
              './assets/images/gallery-all-compressed/screenshot_20260729_008.jpg" alt="">',
              1
          )

          old_pattern = re.compile(
              r'      <div class="terminus-gallery">.*?      </div>\n      <div class="battle-line"',
              re.S
          )

          new_gallery = '''      <div class="terminus-gallery">
        <figure class="story-shot terminus-main-shot reveal-block">
          <img src="./assets/images/gallery-all-compressed/screenshot_20260729_021.jpg" alt="Cassilia wielding Temerius during the temple battle" loading="lazy">
        </figure>
        <div class="terminus-copy reveal-block">
          <p>The story begins when the player discovers a mysterious dataslate inside The Lodge. Its clues lead toward a forgotten temple and an unknown Starborn connected to an ancient weapon.</p>
          <p>Inside waits Cassilia—already overwhelmed by the whispers of Temerius. Their first meeting is not a conversation.</p>
          <blockquote>IT IS A BATTLE.</blockquote>
        </div>
        <figure class="story-shot terminus-secondary-shot reveal-block">
          <img src="./assets/images/gallery-all-compressed/screenshot_20260729_026.jpg" alt="Cassilia walking across the temple grounds with Temerius" loading="lazy">
        </figure>
      </div>
      <div class="terminus-battle-strip" aria-label="Battle at the temple screenshot sequence">
        <figure><img src="./assets/images/gallery-all-compressed/screenshot_20260729_019.jpg" alt="Cassilia confronting the player at the temple" loading="lazy"></figure>
        <figure><img src="./assets/images/gallery-all-compressed/screenshot_20260729_020.jpg" alt="Temerius battle near the ancient structure" loading="lazy"></figure>
        <figure><img src="./assets/images/gallery-all-compressed/screenshot_20260729_022.jpg" alt="Cassilia attacking with Temerius" loading="lazy"></figure>
        <figure><img src="./assets/images/gallery-all-compressed/screenshot_20260729_023.jpg" alt="The player fighting Cassilia in the desert" loading="lazy"></figure>
        <figure><img src="./assets/images/gallery-all-compressed/screenshot_20260729_025.jpg" alt="The player and Cassilia facing one another" loading="lazy"></figure>
      </div>
      <div class="battle-line"'''

          text, count = old_pattern.subn(new_gallery, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace the Terminus gallery block')

          # The final combat frame supports the exact moment before Unity without becoming a text-heavy cover.
          unity_marker = '    <section class="unity-section story-panel" id="unity" data-story-panel>\n'
          unity_bg = '''    <section class="unity-section story-panel" id="unity" data-story-panel>
      <div class="story-photo-bg" aria-hidden="true">
        <img src="./assets/images/gallery-all-compressed/screenshot_20260729_024.jpg" alt="" loading="lazy">
      </div>
'''
          if 'screenshot_20260729_024.jpg' not in text:
              text = text.replace(unity_marker, unity_bg, 1)

          text = re.sub(
              r'cassilia-polish\.js\?v=[^"\']+',
              'cassilia-polish.js?v=2.4.202607291903',
              text
          )

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-cassilia-terminus-story.yml').unlink()
          PY

      - name: Commit corrected story page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cassilia.html .github/workflows/fix-cassilia-terminus-story.yml
          git commit -m "Fix Cassilia Terminus story imagery and spacing"
          git push
