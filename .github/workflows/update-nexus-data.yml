name: Update Nexus dashboard data

# External half-hour workflow_dispatch retained; native backup at :15/:45 UTC.
on:
  # An explicit no-secret commit can immediately request a fresh run.
  push:
    paths:
      - '.github/sync-requests/**'
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialize CC + Nexus data writers; both update assets/js/site-data.js.
concurrency:
  group: sync-portfolio-data-writers
  cancel-in-progress: false

jobs:
  freshness-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check whether scheduled backup is needed
        id: check
        env:
          SYNC_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/check-sync-freshness.mjs assets/data/nexus-latest.json

  update:
    needs: freshness-gate
    if: needs.freshness-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect Nexus stats
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          NEXUS_AUTO_DISCOVER: "true"
          NEXUS_AUTHOR_NAME: "TownGG"
          NEXUS_DISCOVERY_GAME: "starfield"
          NEXUS_DISCOVERY_PERIOD: "1m"
          NEXUS_REQUEST_TIMEOUT: "12"
          NEXUS_REQUEST_ATTEMPTS: "2"
          NEXUS_MAX_WORKERS: "4"
        run: python -u scripts/collect-nexus.py
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/nexus-mods.json assets/data/nexus-history.csv assets/data/nexus-latest.json assets/js/site-data.js
          if git diff --cached --quiet; then
            echo "No Nexus data changes to commit."
          else
            git commit -m "Update Nexus dashboard data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
