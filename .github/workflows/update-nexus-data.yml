name: Update Nexus dashboard data

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-nexus-dashboard-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect Nexus stats
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          NEXUS_AUTO_DISCOVER: "true"
          NEXUS_AUTHOR_NAME: "TownGG"
          NEXUS_DISCOVERY_GAME: "starfield"
          NEXUS_DISCOVERY_PERIOD: "1m"
        run: python scripts/collect-nexus.py
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/nexus-mods.json assets/data/nexus-history.csv assets/data/nexus-latest.json assets/js/site-data.js
          if git diff --cached --quiet; then
            echo "No Nexus data changes to commit."
          else
            git commit -m "Update Nexus dashboard data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Trigger Bethesda Creations sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering Sync Bethesda Creations via workflow_dispatch..."
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sync-creations.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Creations sync dispatch requested."
