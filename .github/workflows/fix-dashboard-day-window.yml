name: Fix dashboard day range visibility

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-day-window.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve daily range note
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          polish = Path('assets/js/admin-dashboard-polish.js')
          text = polish.read_text(encoding='utf-8')
          old = "document.querySelectorAll('.admin-dashboard-title p').forEach((node) => { if (node.textContent !== c.dashboardSubtitle) node.textContent = c.dashboardSubtitle; });"
          new = "document.querySelectorAll('[data-admin-dashboard-subtitle]').forEach((node) => { if (node.textContent !== c.dashboardSubtitle) node.textContent = c.dashboardSubtitle; });"
          if old not in text:
              raise SystemExit('Expected dashboard subtitle selector not found')
          text = text.replace(old, new, 1)
          polish.write_text(text, encoding='utf-8')

          html = Path('admin-upload.html')
          source = html.read_text(encoding='utf-8')
          source = re.sub(r'admin-dashboard-polish\.js\?v=[^"\']+', 'admin-dashboard-polish.js?v=2.05.22', source)
          source = re.sub(r'admin-dashboard\.js\?v=[^"\']+', 'admin-dashboard.js?v=2.05.22', source)
          html.write_text(source, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/admin-dashboard-polish.js admin-upload.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Keep dashboard UTC range visible"
          git pull --rebase origin main
          git push origin HEAD:main
