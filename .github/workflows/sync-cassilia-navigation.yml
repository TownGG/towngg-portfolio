name: Sync Cassilia navigation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-cassilia-navigation.yml"

permissions:
  contents: write

jobs:
  sync-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Cassilia to every site navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          changed = []

          for path in sorted(root.glob('*.html')):
              text = path.read_text(encoding='utf-8-sig')
              nav_match = re.search(r'<nav class="nav-links"[^>]*>(.*?)</nav>', text, re.S)
              if not nav_match:
                  continue

              nav = nav_match.group(1)
              if 'href="./cassilia.html"' in nav:
                  continue

              home = re.search(r'(<a\b[^>]*href="\./index\.html"[^>]*>\s*Home\s*</a>)', nav, re.S)
              if not home:
                  continue

              new_nav = nav[:home.end()] + '\n        <a href="./cassilia.html">Cassilia</a>' + nav[home.end():]
              text = text[:nav_match.start(1)] + new_nav + text[nav_match.end(1):]
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          index = root / 'index.html'
          if index.exists():
              text = index.read_text(encoding='utf-8')
              text = text.replace(
                  'screenshot_20260729_027.jpg',
                  'screenshot_20260729_033.jpg'
              )
              text = re.sub(
                  r'cassilia-home-entry\.css\?v=[^"\']+',
                  'cassilia-home-entry.css?v=2.4.202607291838',
                  text
              )
              index.write_text(text, encoding='utf-8')
              if 'index.html' not in changed:
                  changed.append('index.html')

          print('Updated:', ', '.join(changed) if changed else 'nothing')
          PY

      - name: Commit synchronized navigation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No navigation changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Sync Cassilia navigation across site pages"
          git push
