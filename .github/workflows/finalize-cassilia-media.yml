name: Finalize Cassilia media distribution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-cassilia-media.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate unique and existing screenshot assignments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          html_path = Path('cassilia.html')
          html = html_path.read_text(encoding='utf-8')
          pattern = re.compile(r'screenshot_20260729_(\d{3})\.jpg')
          refs = [int(x) for x in pattern.findall(html)]
          narrative = [n for n in refs if n >= 8]
          duplicates = sorted({n for n in narrative if narrative.count(n) > 1})
          assert not duplicates, f'Duplicate narrative screenshots: {duplicates}'

          missing = [n for n in sorted(set(refs)) if not Path(f'assets/images/gallery-all-compressed/screenshot_20260729_{n:03d}.jpg').exists()]
          assert not missing, f'Missing screenshots: {missing}'

          match = re.search(r'<section class="mods-section[\s\S]*?</section>', html)
          assert match, 'MOD archive section not found'
          mods_html = match.group(0)
          outside_mods = html[:match.start()] + html[match.end():]
          for number in range(1, 8):
              token = f'screenshot_20260729_{number:03d}.jpg'
              assert token in mods_html, f'MOD cover {number:03d} missing from card archive'
              assert token not in outside_mods, f'MOD cover {number:03d} used outside card archive'

          assert 'screenshot_20260729_033.jpg' not in html, 'Homepage image 033 is duplicated on detail page'
          assert 'cassilia-media.css?v=3.1.202607292152' in Path('assets/css/cassilia.css').read_text(encoding='utf-8')

          print(f'Validated {len(narrative)} unique narrative screenshots: {narrative}')
          print('Validated MOD covers 001-007 only inside the MOD archive.')
          PY

      - name: Remove temporary audit files and publish production version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('  <a href="./audit/cassilia-review.html" style="display:none" aria-hidden="true">Cassilia screenshot audit</a>\n', '')
          index.write_text(text, encoding='utf-8')

          version = {
            'version': 'v2.06.202607292152',
            'label': 'v2.06.202607292152 Production',
            'status': 'production',
            'updatedAt': '2026-07-29T13:52:00.000Z'
          }
          Path('assets/data/site-version.json').write_text(json.dumps(version, indent=2) + '\n', encoding='utf-8')
          PY

          rm -rf audit
          rm -f \
            .github/workflows/build-cassilia-contact-sheet.yml \
            .github/workflows/add-cassilia-audit-link.yml \
            .github/workflows/caption-cassilia-screenshots.yml \
            .github/workflows/qa-cassilia-story.yml \
            .github/workflows/adjust-cassilia-media.yml \
            .github/workflows/finalize-cassilia-media.yml

      - name: Commit clean production state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize balanced Cassilia story media"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 4
          done
          exit 1
