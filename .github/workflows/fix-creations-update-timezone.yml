name: Fix Creations update time timezone

on:
  push:
    paths:
      - '.github/workflows/fix-creations-update-timezone.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display Creations update timestamps in Beijing time
        run: |
          python - <<'PY'
          from pathlib import Path

          live = Path('assets/js/creations-live-refresh.js')
          text = live.read_text(encoding='utf-8')
          old = '''  function parseTime(value) {
    const raw = String(value || '').trim();
    if (!raw) return 0;
    const date = new Date(raw.replace(' ', 'T'));
    return Number.isNaN(date.getTime()) ? 0 : date.getTime();
  }

  function formatTime(value) {
    const raw = String(value || '').trim();
    if (!raw) return '';
    const date = new Date(raw.replace(' ', 'T'));
    if (Number.isNaN(date.getTime())) return raw;
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const hour = String(date.getHours()).padStart(2, '0');
    const minute = String(date.getMinutes()).padStart(2, '0');
    return `${year}-${month}-${day} ${hour}:${minute}`;
  }
'''
          new = '''  function utcDate(value) {
    const raw = String(value || '').trim();
    if (!raw) return null;
    const base = raw.length === 10 ? `${raw} 00:00` : raw;
    const iso = base.replace(' ', 'T');
    const normalized = /(?:Z|[+-]\\d{2}:?\\d{2})$/i.test(iso) ? iso : `${iso}Z`;
    const date = new Date(normalized);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  function parseTime(value) {
    return utcDate(value)?.getTime() || 0;
  }

  function formatTime(value) {
    const date = utcDate(value);
    if (!date) return String(value || '').trim();
    const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Shanghai',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    }).formatToParts(date).map((part) => [part.type, part.value]));
    return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}`;
  }
'''
          if old not in text:
              raise SystemExit('live refresh timestamp block not found')
          live.write_text(text.replace(old, new, 1), encoding='utf-8')

          trend = Path('assets/js/creations-trend.js')
          text = trend.read_text(encoding='utf-8')
          old = '''  function parseTimestamp(value) {
    const raw = String(value || "").trim();
    if (!raw) return 0;
    const normalized = raw.length === 10 ? `${raw} 00:00` : raw;
    const date = new Date(normalized.replace(" ", "T"));
    return Number.isNaN(date.getTime()) ? 0 : date.getTime();
  }
  function formatDashboardTime(value) {
    const raw = String(value || "").trim();
    if (!raw) return "";
    const normalized = raw.length === 10 ? `${raw} 00:00` : raw;
    const date = new Date(normalized.replace(" ", "T"));
    if (Number.isNaN(date.getTime())) return raw;
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    const hour = String(date.getHours()).padStart(2, "0");
    const minute = String(date.getMinutes()).padStart(2, "0");
    return `${year}-${month}-${day} ${hour}:${minute}`;
  }
'''
          new = '''  function utcDate(value) {
    const raw = String(value || "").trim();
    if (!raw) return null;
    const base = raw.length === 10 ? `${raw} 00:00` : raw;
    const iso = base.replace(" ", "T");
    const normalized = /(?:Z|[+-]\\d{2}:?\\d{2})$/i.test(iso) ? iso : `${iso}Z`;
    const date = new Date(normalized);
    return Number.isNaN(date.getTime()) ? null : date;
  }
  function parseTimestamp(value) {
    return utcDate(value)?.getTime() || 0;
  }
  function formatDashboardTime(value) {
    const date = utcDate(value);
    if (!date) return String(value || "").trim();
    const parts = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Shanghai",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).formatToParts(date).map((part) => [part.type, part.value]));
    return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}`;
  }
'''
          if old not in text:
              raise SystemExit('trend timestamp block not found')
          trend.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/creations-live-refresh.js assets/js/creations-trend.js
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Show Creation update times in Beijing time"
          git pull --rebase origin main
          git push origin HEAD:main
