  <style>

  <div class="progress" id="progress" aria-hidden="true"></div>

        <p class="description">从青藤上的第一句话，到穿上婚纱、走进属于我们的小家。<br>我们的每一天，都在写下一段新的故事。</p>

        {date:'2029 · 计划中',year:'2029 · 我们的家',title:'买下我们',accent:'的小家',description:'在绵阳，找到属于我们的温暖角落。留一间双人书房，一起工作、游戏，也一起发呆。',note:'90–110㎡ · 我们的理想小家',symbol:'⌂',tone:'champagne'},
        {date:'2029—2030 · 计划中',year:'2029—2030 · 筑家',title:'一起装修',accent:'我们的家',description:'暖白色地板、现代意式极简风。一起选灯、挑家具，把喜欢的生活一点点装进家里。',note:'一点点，把梦想变成现实',symbol:'✦',tone:'rose'},
        {date:'2030 · 我们的新生活',year:'2030 · 幸福生活',title:'搬进新家',accent:'幸福生活',description:'清晨一起吃早餐，夜晚窝在沙发里。两个人、一盏灯、一间家，往后的日子都慢慢过。',note:'余生请多指教 ♡',symbol:'∞',tone:'champagne'}
      ];
      const chapters = document.getElementById('chapters');
      const story = document.getElementById('story');
      const escapeHTML = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      chapters.insertAdjacentHTML('beforeend',milestones.map((m,i) => `
        <section class="slide ${m.tone}" aria-label="${escapeHTML(m.date+' '+m.title+(m.accent||''))}">
          <span class="float a" aria-hidden="true">✦</span><span class="float b" aria-hidden="true">♡</span><span class="float c" aria-hidden="true">✧</span>
          <div class="inner">
            <div class="copy">
              <div class="year">${escapeHTML(m.year)}</div>
              <div class="kicker">${escapeHTML(m.date)} · ${m.done?'已珍藏':'我们的约定'}</div>
              <h2>${escapeHTML(m.title)}${m.accent?'<br><em>'+escapeHTML(m.accent)+'</em>':''}</h2>
              <p class="description">${escapeHTML(m.description)}</p>
              <div class="subtle">${escapeHTML(m.note)}</div>
            </div>
            <div class="ornament" aria-hidden="true"><div class="ring"><span class="glyph">${escapeHTML(m.symbol)}</span></div><span class="orbit-note">${escapeHTML(m.done?'♡ 已珍藏':'✧ 幸福待续')}</span></div>
          </div>
        </section>`).join(''));
      const slides = [...story.querySelectorAll('.slide')];
      const dots = document.getElementById('dots');
      dots.innerHTML = slides.map((s,i)=>`<button type="button" aria-label="跳转到第 ${i+1} 屏" title="${i===0?'故事封面':i===slides.length-1?'幸福终章':escapeHTML(milestones[i-1].title)}" data-index="${i}"></button>`).join('');
      let current = 0, autoplay = null, wheelLock = 0;
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const prev = document.getElementById('prev'), next = document.getElementById('next');
      const play = document.getElementById('play'), full = document.getElementById('fullscreen');
      const go = (index,behavior) => {
        const target = Math.max(0,Math.min(slides.length-1,index));
        slides[target].scrollIntoView({behavior:behavior|| (reducedMotion?'auto':'smooth'),block:'start'});
        activate(target);
      };
      function activate(index) {
        current = index;
        slides.forEach((s,i)=>s.classList.toggle('is-active',i===index));
        dots.querySelectorAll('button').forEach((b,i)=>{if(i===index)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
        document.getElementById('count').textContent=String(index+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
        document.getElementById('progress').style.width=(index/(slides.length-1)*100)+'%';
        document.getElementById('chapterYear').textContent=index===0?'2026 — 2030':index===slides.length-1?'FOREVER ♡':(milestones[index-1]?.year || '');
        document.body.classList.toggle('is-night',slides[index].classList.contains('night'));
        prev.disabled=index===0; next.disabled=index===slides.length-1;
        if(index===slides.length-1&&autoplay)stopAutoplay();
      }
      const observer=new IntersectionObserver(entries=>{
        const candidates=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);
        if(candidates[0])activate(slides.indexOf(candidates[0].target));
      },{root:story,threshold:[.55,.7,.9]});
      slides.forEach(s=>observer.observe(s));
      function stopAutoplay(){clearInterval(autoplay);autoplay=null;play.setAttribute('aria-label','自动播放');play.title='自动播放';document.getElementById('playIcon').innerHTML='<path d="m8 5 11 7-11 7z"/>';}
      function toggleAutoplay(){if(autoplay){stopAutoplay();return;}if(current===slides.length-1)go(0);autoplay=setInterval(()=>{if(current<slides.length-1)go(current+1);else stopAutoplay();},7000);play.setAttribute('aria-label','暂停自动播放');play.title='暂停自动播放';document.getElementById('playIcon').innerHTML='<path d="M8 5v14M16 5v14"/>';}
      document.getElementById('begin').addEventListener('click',()=>go(1));
      prev.addEventListener('click',()=>{stopAutoplay();go(current-1);});
      next.addEventListener('click',()=>{stopAutoplay();go(current+1);});
      dots.addEventListener('click',e=>{const b=e.target.closest('[data-index]');if(b){stopAutoplay();go(Number(b.dataset.index));}});
      play.addEventListener('click',toggleAutoplay);
      full.addEventListener('click',async()=>{if(!document.fullscreenElement){if(story.requestFullscreen){try{await story.requestFullscreen();}catch{full.title='当前浏览器不支持全屏';}}else{full.title='当前浏览器不支持全屏';}}else if(document.exitFullscreen){await document.exitFullscreen();}});
      if(!document.fullscreenEnabled)full.hidden=true;
      document.addEventListener('keydown',e=>{
        if(e.altKey||e.metaKey||e.ctrlKey||/input|textarea|select/i.test(document.activeElement?.tagName||''))return;
        let step=0;if(['ArrowDown','ArrowRight','PageDown',' '].includes(e.key))step=1;
        if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key))step=-1;
        if(e.key==='Home'){e.preventDefault();stopAutoplay();go(0);return;}
        if(e.key==='End'){e.preventDefault();stopAutoplay();go(slides.length-1);return;}
        if(step){e.preventDefault();stopAutoplay();go(current+step);}
      });
      story.addEventListener('wheel',e=>{
        if(e.ctrlKey||Math.abs(e.deltaY)<13)return;
        e.preventDefault();
        const now=Date.now();if(now-wheelLock<830)return;
        wheelLock=now;stopAutoplay();go(current+(e.deltaY>0?1:-1));
      },{passive:false});
      story.addEventListener('touchstart',()=>{if(autoplay)stopAutoplay();},{passive:true});
      activate(0);
    })();
  </script>
</body>
</html>
